<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="calculator">

        <!-- DISPLAY -->

        <input
            type="text"
            id="display"
            value="0"
            readonly
        >


        <!-- MEMORY BUTTONS -->

        <div class="memory-buttons">

            <button onclick="memoryClear()">
                MC
            </button>

            <button onclick="memoryRecall()">
                MR
            </button>

            <button onclick="memoryAdd()">
                M+
            </button>

        </div>


        <!-- CALCULATOR BUTTONS -->

        <div class="buttons">

            <button onclick="clearDisplay()">
                C
            </button>

            <button onclick="deleteNumber()">
                ⌫
            </button>

            <button onclick="chooseOperator('%')">
                %
            </button>

            <button onclick="chooseOperator('/')">
                ÷
            </button>


            <button onclick="addNumber('7')">
                7
            </button>

            <button onclick="addNumber('8')">
                8
            </button>

            <button onclick="addNumber('9')">
                9
            </button>

            <button onclick="chooseOperator('*')">
                ×
            </button>


            <button onclick="addNumber('4')">
                4
            </button>

            <button onclick="addNumber('5')">
                5
            </button>

            <button onclick="addNumber('6')">
                6
            </button>

            <button onclick="chooseOperator('-')">
                −
            </button>


            <button onclick="addNumber('1')">
                1
            </button>

            <button onclick="addNumber('2')">
                2
            </button>

            <button onclick="addNumber('3')">
                3
            </button>

            <button onclick="chooseOperator('+')">
                +
            </button>


            <button onclick="addNumber('0')"
                class="zero">
                0
            </button>

            <button onclick="addNumber('.')">
                .
            </button>

            <button onclick="calculate()"
                class="equals">
                =
            </button>

        </div>


        <!-- HISTORY BUTTON -->

        <button
            class="history-button"
            onclick="openHistory()">

            History

        </button>

    </div>


    <!-- HISTORY PANEL -->

    <div
        id="historyPanel"
        class="history-panel">

        <div class="history-header">

            <h2>History</h2>

            <button onclick="closeHistory()">
                ×
            </button>

        </div>


        <div
            id="history"
            class="history-list">

            <div class="empty-history">

                <div class="empty-icon">
                    ⌁
                </div>

                <p>
                    No calculations yet
                </p>

                <span>
                    Your calculations will appear here.
                </span>

            </div>

        </div>


        <button
            class="clear-history"
            onclick="clearHistory()">

            Clear History

        </button>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
